<div style="display:flex; flex-direction:row; align-items:stretch; column-gap:4px; height:48px;">
  <!-- LIST TAB: onClick -> set viewMode to empty. Bar visible when $state.viewMode !== "month" -->
  <div style="display:flex; flex-direction:column; align-items:stretch; height:48px; padding:0 14px; cursor:pointer; box-sizing:border-box;">
    <div style="display:flex; flex:1 1 auto; align-items:center; justify-content:center;"><span style="font-size:14px; font-weight:700; color:#2a0628;">List</span></div>
    <div style="height:3px; background-color:#8e2a88;"></div>
  </div>
  <!-- MONTH TAB: onClick -> set viewMode to "month". Bar visible when $state.viewMode === "month" -->
  <div style="display:flex; flex-direction:column; align-items:stretch; height:48px; padding:0 14px; cursor:pointer; box-sizing:border-box;">
    <div style="display:flex; flex:1 1 auto; align-items:center; justify-content:center;"><span style="font-size:14px; font-weight:700; color:#2a0628;">Month</span></div>
    <div style="height:3px; background-color:#8e2a88;"></div>
  </div>
</div>
